<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <title>ZNS – Nachricht</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        html,
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: rgba(3, 6, 12, 0.97);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* Pulsierender Hintergrund */
        .hintergrund {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center,
                    rgba(245, 158, 11, 0.10) 0%,
                    rgba(0, 0, 0, 0) 70%);
            animation: pulsieren 2.2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulsieren {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* Nachrichtenkarte */
        .karte {
            position: relative;
            z-index: 10;
            background: linear-gradient(150deg, #1b1710 0%, #14100a 100%);
            border: 2px solid var(--warning);
            border-radius: var(--radius-xl);
            padding: 44px 52px 36px;
            width: min(760px, 88vw);
            max-height: 88vh;
            overflow-y: auto;
            text-align: center;
            box-shadow:
                0 0 0 1px rgba(245, 158, 11, 0.18),
                0 0 60px rgba(245, 158, 11, 0.18),
                0 30px 80px rgba(0, 0, 0, 0.85);
            animation: karte-rein 0.32s cubic-bezier(0.34, 1.4, 0.64, 1);
        }

        @keyframes karte-rein {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(18px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .symbol {
            font-size: 46px;
            display: block;
            margin-bottom: 10px;
        }

        .kennzeichen {
            display: inline-block;
            background: var(--warning);
            color: #241900;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            padding: 5px 16px;
            border-radius: 99px;
            margin-bottom: 18px;
        }

        .absender {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.4px;
        }

        .absender strong {
            color: var(--warning);
            font-size: 16px;
        }

        .nachricht {
            font-size: 27px;
            font-weight: 700;
            color: #fff;
            line-height: 1.35;
            margin: 22px 0 28px;
            word-break: break-word;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* Antwortbereich */
        .antwort-bereich {
            margin-bottom: 22px;
            text-align: left;
        }

        .antwort-bereich textarea {
            background: rgba(0, 0, 0, 0.35);
            border-color: var(--border-light);
            min-height: 74px;
            font-size: 16px;
            user-select: text;
        }

        .antwort-bereich textarea:focus {
            border-color: var(--warning);
            box-shadow: 0 0 0 3px var(--warning-dim);
        }

        .antwort-hinweis {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 7px;
            text-align: right;
        }

        .knopfreihe {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .fusszeile {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .wartend {
            background: var(--bg-ternary);
            border: 1px solid var(--border);
            padding: 3px 12px;
            border-radius: 99px;
        }

        /* ── Notfall-Darstellung ── */

        body.notfall .hintergrund {
            background: radial-gradient(ellipse at center,
                    rgba(220, 0, 0, 0.18) 0%,
                    rgba(0, 0, 0, 0) 70%);
            animation: pulsieren 0.85s ease-in-out infinite;
        }

        body.notfall .karte {
            background: linear-gradient(150deg, #1f0505 0%, #140202 100%);
            border-color: #ff2f2f;
            box-shadow:
                0 0 0 1px rgba(255, 47, 47, 0.3),
                0 0 70px rgba(220, 0, 0, 0.45),
                0 30px 80px rgba(0, 0, 0, 0.9);
        }

        body.notfall .kennzeichen {
            background: #ff2f2f;
            color: #fff;
            font-size: 13px;
            letter-spacing: 2.4px;
            padding: 6px 20px;
        }

        body.notfall .absender strong {
            color: #ff6b6b;
        }

        body.notfall .symbol {
            animation: warnen 0.6s ease-in-out infinite alternate;
        }

        @keyframes warnen {
            from {
                transform: scale(1) rotate(-5deg);
            }

            to {
                transform: scale(1.12) rotate(5deg);
            }
        }

        body.notfall .antwort-bereich textarea:focus {
            border-color: #ff2f2f;
            box-shadow: 0 0 0 3px var(--danger-dim);
        }
    </style>
</head>

<body>

    <div class="hintergrund"></div>

    <div class="karte" id="karte">
        <span class="symbol" id="symbol">✉️</span>
        <div class="kennzeichen" id="kennzeichen">Neue Nachricht</div>

        <div class="absender">von <strong id="absender">–</strong></div>

        <div class="nachricht" id="nachricht">Lade …</div>

        <div class="antwort-bereich">
            <label for="antwort">Antwort (optional)</label>
            <textarea id="antwort" placeholder="Hier kurz antworten …" maxlength="500"></textarea>
            <div class="antwort-hinweis">Strg + Enter zum Senden</div>
        </div>

        <div class="knopfreihe">
            <button class="btn btn-success btn-lg" id="btnBestaetigen">✓&nbsp; Gelesen</button>
            <button class="btn btn-primary btn-lg" id="btnAntworten" disabled>➤&nbsp; Antwort senden</button>
        </div>

        <div class="fusszeile">
            <span id="uhrzeit"></span>
            <span class="wartend" id="wartend" style="display:none"></span>
        </div>
    </div>

    <script>
        let aktuelleNachricht = null
        let gesendet = false

        const el = (id) => document.getElementById(id)

        // ── Eingehende Nachricht anzeigen ──────────────────────────
        window.zns.beiZeigeNachricht((msg) => {
            aktuelleNachricht = msg
            gesendet = false

            const istNotfall = !!msg.is_emergency
            document.body.classList.toggle('notfall', istNotfall)

            el('symbol').textContent = istNotfall ? '🚨' : '✉️'
            el('kennzeichen').textContent = istNotfall ? 'Notfall' : 'Neue Nachricht'
            el('absender').textContent = msg.sender_name || 'Unbekannt'
            el('nachricht').textContent = msg.message_text || ''

            // Antwortfeld leeren und für die Eingabe vorbereiten
            const antwort = el('antwort')
            antwort.value = ''
            el('btnAntworten').disabled = true

            // Uhrzeit
            el('uhrzeit').textContent = zeitFormat(msg.created_at)

            // Hinweis auf weitere wartende Nachrichten
            const wartend = el('wartend')
            if (msg.wartend > 0) {
                wartend.textContent =
                    msg.wartend === 1 ? '1 weitere Nachricht wartet' : `${msg.wartend} weitere Nachrichten warten`
                wartend.style.display = 'inline-block'
            } else {
                wartend.style.display = 'none'
            }

            // Karte neu einblenden
            const karte = el('karte')
            karte.style.animation = 'none'
            void karte.offsetWidth
            karte.style.animation = ''

            karte.scrollTop = 0
            setTimeout(() => antwort.focus(), 120)
        })

        function zeitFormat(iso) {
            if (!iso) return ''
            try {
                return new Date(iso).toLocaleTimeString('de-DE', {
                    hour: '2-digit',
                    minute: '2-digit',
                })
            } catch (_) {
                return ''
            }
        }

        // ── Erledigen (mit oder ohne Antwort) ──────────────────────
        function erledigen(mitAntwort) {
            if (!aktuelleNachricht || gesendet) return
            gesendet = true

            const text = mitAntwort ? el('antwort').value.trim() : ''

            window.zns.overlayErledigt({
                message_id: aktuelleNachricht.message_id,
                sender_id: aktuelleNachricht.sender_id,
                antwort: text,
            })

            aktuelleNachricht = null
            el('antwort').value = ''
            el('btnAntworten').disabled = true
        }

        el('btnBestaetigen').addEventListener('click', () => erledigen(false))
        el('btnAntworten').addEventListener('click', () => erledigen(true))

        // Antwort-Knopf nur aktiv, wenn wirklich Text da ist
        el('antwort').addEventListener('input', (e) => {
            el('btnAntworten').disabled = e.target.value.trim().length === 0
        })

        // ── Tastatur ───────────────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            const imTextfeld = document.activeElement === el('antwort')
            const hatText = el('antwort').value.trim().length > 0

            // Strg + Enter: Antwort senden
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault()
                erledigen(hatText)
                return
            }

            // Enter ausserhalb des Textfelds: nur bestätigen
            if (e.key === 'Enter' && !imTextfeld) {
                e.preventDefault()
                erledigen(hatText)
            }
        })
    </script>
</body>

</html>
